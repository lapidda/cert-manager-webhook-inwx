# Example only; not part of deploy/. The solver block is what matters.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - selector:
          dnsZones: ["lab.p5y.de"]
        dns01:
          webhook:
            groupName: acme.p5y.de
            solverName: inwx
            config:
              ttl: 300
              # sandbox: true        # INWX OTE instead of the live API
              usernameSecretRef:
                name: inwx-credentials
                key: username
              passwordSecretRef:
                name: inwx-credentials
                key: password
              # totpSecretRef:       # only if the INWX user has 2FA enabled
              #   name: inwx-credentials
              #   key: totp-secret
