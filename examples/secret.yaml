# Template. Fill it in yourself and encrypt it (sops) before it goes to Git.
# Must be in the cert-manager namespace and keep this name: the RBAC of the
# webhook allows reading exactly cert-manager/inwx-credentials.
apiVersion: v1
kind: Secret
metadata:
  name: inwx-credentials
  namespace: cert-manager
type: Opaque
stringData:
  username: "<inwx api user>"
  password: "<password>"
  # totp-secret: "<base32 shared secret>"   # only with 2FA
