apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` transformer on purpose: one RoleBinding must live in
# kube-system, and the transformer would move it. Namespaces are explicit.
resources:
  - rbac.yaml
  - pki.yaml
  - deployment.yaml
  - service.yaml
  - apiservice.yaml
  - networkpolicy.yaml
