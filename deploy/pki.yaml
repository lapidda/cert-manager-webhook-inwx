# Serving certificate for the webhook, issued by cert-manager itself:
#   self-signed Issuer -> private CA -> CA Issuer -> serving certificate.
# kube-apiserver must trust that CA; cainjector copies it into the caBundle
# of the APIService (see the annotation in apiservice.yaml).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: inwx-webhook-selfsign
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: inwx-webhook-ca
  namespace: cert-manager
spec:
  secretName: inwx-webhook-ca
  isCA: true
  commonName: ca.inwx-webhook.cert-manager
  duration: 43800h # 5 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: inwx-webhook-selfsign
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: inwx-webhook-ca
  namespace: cert-manager
spec:
  ca:
    secretName: inwx-webhook-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: inwx-webhook-serving
  namespace: cert-manager
spec:
  secretName: inwx-webhook-serving
  duration: 8760h # 1 year, renewed automatically
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - inwx-webhook
    - inwx-webhook.cert-manager
    - inwx-webhook.cert-manager.svc
  issuerRef:
    name: inwx-webhook-ca
